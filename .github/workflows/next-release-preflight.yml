name: Next release source preflight

on:
  pull_request:
    paths:
      - 'tools/release/**'
      - 'internal/buildinfo/**'
      - 'packaging/macos/app-identity.sh'
      - '.github/workflows/next-release-preflight.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Illustrative RC contract only; no tag or release is created'
        required: true
        default: '0.9.1-rc.1'
        type: string
      bundle_build:
        description: 'Explicit macOS bundle build ordinal (source dry-run only)'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Source contract and negative tests
        run: go test ./tools/release ./internal/buildinfo -count=1
      - name: Generate and verify source-only candidate manifest
        env:
          RC_VERSION: ${{ inputs.version || '0.9.1-rc.1' }}
          BUNDLE_BUILD: ${{ inputs.bundle_build || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          stamp="$(git show -s --format=%ct HEAD)"
          build_date="$(date -u -d "@$stamp" +%Y-%m-%dT%H:%M:%SZ)"
          args=(next-preflight --version "$RC_VERSION" --tag "next-v$RC_VERSION" --commit "$commit" --build-date "$build_date" --bundle-build "$BUNDLE_BUILD")
          go run ./tools/release "${args[@]}" > "$RUNNER_TEMP/next-candidate.json"
          go run ./tools/release "${args[@]}" --verify "$RUNNER_TEMP/next-candidate.json"
