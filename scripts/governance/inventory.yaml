# AgentDock 脚本治理清单。
# 分类：bootstrap / runtime-adapter / packaging / test / dev / legacy / ci
# 公开入口不得改名删除。legacy 脚本禁止新增产品能力。
# 超过 review_threshold_lines 的新增脚本必须写 oversize_justification。

review_threshold_lines: 300

scripts:
  - path: packaging/macos/build-next-shared.sh
    class: packaging
    owner: desktop
    public_contract: false
    deletable: false

  - path: packaging/macos/next_shared_bundle.py
    class: packaging
    owner: desktop
    public_contract: false
    deletable: false

  - path: packaging/macos/deploy-next-shared.py
    class: packaging
    owner: desktop
    public_contract: false
    deletable: false
    oversize_justification: Next-only 部署安全交易需在同一受控流程核對來源身份、服務重新註冊、失敗回滾與原服務隔離；目前 329 行，後續可獨立重構，但不可省略這些保護。
    notes: Next-only 交易部署、服务重新注册及保留回滚 Contents；不得修改 stable App。

  - path: packaging/macos/install-next-shared.py
    class: packaging
    owner: desktop
    public_contract: false
    deletable: false

  - path: scripts/release/next-unpublished-candidate-macos.sh
    class: release
    owner: desktop
    public_contract: false
    deletable: false
    notes: Next-only 手動觸發的未發佈來源候選驗證；僅驗證 ad-hoc 包與來源身分，不上傳或公開發行。

  - path: scripts/test/test-next-shared-deploy.py
    class: test
    owner: desktop
    public_contract: false
    deletable: false
    oversize_justification: Next-only 手動部署安全測試含 SemVer preflight、受限 Core metadata、stage/owner、原生 PID 與原子回滾失敗注入的正負測；聚合於單一安全邊界測試檔避免覆蓋遺漏。
    notes: Next-only 安装、回滚及服务重注册的安全回归测试。

  - path: scripts/test/test-next-shared-package.py
    class: test
    owner: desktop
    public_contract: false
    deletable: false
    oversize_justification: Next-only macOS App 安全封裝與原生身分的端到端負向測試，覆蓋簽章、版本、bundle 檔案佈局及候選隔離；目前約 410 行，不能略過重要平台契約。

  - path: scripts/install/install.sh
    class: bootstrap
    owner: installer
    public_contract: true
    deletable: false
    legacy_oversize: true
    oversize_justification: 公开 Unix bootstrap，包含 Linux 交互菜单、校验下载和卸载转发；不得改名。
    notes: Unix 公开安装入口。只负责平台检测、交互、下载校验和 bootstrap，再调用 Go Installer Engine。

  - path: scripts/install/install.ps1
    class: runtime-adapter
    owner: installer
    public_contract: true
    deletable: false
    legacy_oversize: true
    oversize_justification: Windows 公开 bootstrap / Setup 契约；generation、stable shim、manifest 与事务由 Go Installer Engine 拥有，脚本保留 UAC/DPAPI/Registry/session 外层适配。
    notes: 公开 Windows 安装入口。UAC、DPAPI、Inno 结果文件和用户 session broker 仍留在脚本。

  - path: scripts/install/uninstall-windows.ps1
    class: runtime-adapter
    owner: installer
    public_contract: false
    deletable: false
    oversize_justification: Windows Setup 内部卸载适配器；stable binary 删除后仍需完成可重入 Installer transaction、Task/Registry 和进程占用文件清理。

  - path: scripts/install/launch-windows-process.ps1
    class: runtime-adapter
    owner: installer
    public_contract: false
    deletable: false
    notes: Setup RedirectionGuard 进程树到当前用户 interactive session 的内部薄 broker；通过原生 service task-start 选择 RunEx session。

  - path: scripts/install/probe-protected-text.ps1
    class: runtime-adapter
    owner: installer
    public_contract: false
    deletable: false
    notes: Windows Setup 的只读 DPAPI 可用性探针；只返回状态码，不输出凭据明文。

  - path: scripts/test/check-scripts.sh
    class: test
    owner: ci
    public_contract: false
    deletable: false

  - path: scripts/test/check-macos-i18n.py
    class: test
    owner: ci
    public_contract: false
    deletable: true

  - path: scripts/test/test_shell_variable_boundaries.py
    class: test
    owner: ci
    public_contract: false
    deletable: true

  - path: scripts/test/test-install-entry.sh
    class: test
    owner: installer
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: 覆盖公开 install.sh 下载、校验、卸载和参数透传。

  - path: scripts/test/test-install-macos.sh
    class: test
    owner: installer
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: macOS 安装器平台 E2E，负责 VM/权限之外的环境编排。

  - path: scripts/test/linux-installer-e2e-vps.sh
    class: test
    owner: installer
    public_contract: false
    deletable: false
    oversize_justification: Linux Installer Engine VPS E2E（非 root + sudo + systemd + 身份/属主断言），URL 经 env 注入。

  - path: scripts/test/test-macos-identity.py
    class: test
    owner: desktop
    public_contract: false
    deletable: false
    notes: stable/Next App Bundle identity 和 LaunchAgent metadata fixture。

  - path: scripts/test/test-macos-app.sh
    class: test
    owner: desktop
    public_contract: false
    deletable: false

  - path: scripts/test/test-docker-images.sh
    class: test
    owner: ci
    public_contract: false
    deletable: true

  - path: scripts/test/test-install-windows.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: Windows 安装器契约测试，含下载字节一致性和 PowerShell 5.1 约束。

  - path: scripts/test/test-install-windows-download.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false

  - path: scripts/test/test-install-windows-e2e.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false

  - path: scripts/test/test-windows-setup-e2e.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: Windows Setup E2E，负责管理员权限、Task Scheduler 和用户 session。

  - path: scripts/test/test-windows-setup-activation-deferred.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false

  - path: scripts/test/test-windows-quick-tunnel-lifecycle.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: Windows Quick Tunnel 生命周期，依赖真实 Task Scheduler/进程。

  - path: scripts/test/test-windows-named-tunnel-lifecycle.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false
    oversize_justification: Windows Named Tunnel 三代生命周期 E2E，覆盖安装、同版 repair、升级、DPAPI/固定地址保持与认证失败回滚，需要真实 Windows 进程和 Installer Engine 编排。


  - path: scripts/test/test-windows-runtime-launch-diagnostics.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false

  - path: scripts/test/test-windows-current-binary-as-standard-user.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false

  - path: scripts/test/test-windows-release-backcompat.ps1
    class: test
    owner: release
    public_contract: false
    deletable: false
    notes: 用真实 v0.8.2/v0.8.3 selfupdate 源码验证当前 Windows Release ZIP 仍满足已发布 updater 契约。

  - path: scripts/test/test-windows-legacy-online-migration.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false
    notes: 在隔离 runtime 中验证旧 flat Windows 安装可一次性迁移到 committed generation，且不触碰宿主生产实例。

  - path: scripts/test/run-windows-installer-e2e-as-standard-user.ps1
    class: test
    owner: installer
    public_contract: false
    deletable: false

  - path: packaging/macos/app-identity.sh
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    notes: build-app.sh 使用的 stable/Next 固定 App identity 與 LaunchAgent metadata contract。

  - path: packaging/macos/build-app.sh
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: macOS App/DMG 构建。签名和 bundle 布局必须用平台工具；版本与 checksum 归 tools/release。

  - path: packaging/windows/build-windows-offline-setup.ps1
    class: packaging
    owner: release
    public_contract: false
    deletable: false

  - path: packaging/windows/build-wsl-helper-payload.ps1
    class: packaging
    owner: release
    public_contract: false
    deletable: false

  - path: packaging/windows/set-version-info.ps1
    class: packaging
    owner: release
    public_contract: false
    deletable: true
    notes: 为 AgentDock 自有 Windows 可执行文件写入/校验 SignPath Foundation 要求的 VersionInfo 元数据，必须在 Authenticode 签名前运行。

  - path: packaging/windows/sign-windows.ps1
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    notes: 调用 Authenticode 签名工具，保留为薄适配。

  - path: packaging/windows/compat/manage-windows.ps1
    class: legacy
    owner: release
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: v0.8.2/v0.8.3 已发布 updater 会安装并可能在恢复路径调用该脚本；这里保留 v0.8.3 原始字节作为跨版本 Release 兼容资产，禁止新增产品能力。
    notes: 仅进入 Windows Release ZIP 兼容旧 updater；generation 迁移成功后从安装目录删除，旧版本退出支持窗口后可整体移除。

  - path: packaging/windows/NextAgentDock.iss
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    notes: Next-only Inno source, build remains fail-closed; do not reuse Stable identity, payload or code.iss.

  - path: packaging/windows/includes/next-code.iss
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    notes: Next-only defensive path and identity checks; not an accepted installer lifecycle.

  - path: packaging/windows/includes/next-payload.iss
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    notes: Reserved Next-only payload declaration, no Stable fallback.

  - path: packaging/windows/prepare-next-rc.py
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    notes: Next RC source and offline candidate input verifier; installer compilation is always refused.

  - path: scripts/test/test-next-windows-packaging.py
    class: test
    owner: release
    public_contract: false
    deletable: false
    oversize_justification: 包含 Next 來源候選版檔案身分、架構、SHA、輸入污染、禁止 Installer 編譯與 canonical manifest 負向驗證；不得視為 Windows 原生 UAT。

  - path: scripts/test/test-next-wpf-runtime.py
    class: test
    owner: desktop
    public_contract: false
    deletable: false
    notes: Windows Next manifest 身分靜態檢查；native 測試需 Windows host，不作本階段 release gate。

  - path: packaging/windows/AgentDock.iss
    class: packaging
    owner: release
    public_contract: true
    deletable: false
    notes: Inno Setup 定义，平台打包工具本身合理。

  - path: packaging/windows/includes/code.iss
    class: packaging
    owner: release
    public_contract: true
    deletable: false
    legacy_oversize: true
    oversize_justification: Inno Setup Pascal 安装过程，平台打包工具本身合理。

  - path: packaging/windows/includes/messages.iss
    class: packaging
    owner: release
    public_contract: true
    deletable: false

  - path: packaging/docker/docker-healthcheck.sh
    class: ci
    owner: release
    public_contract: false
    deletable: false

  - path: packaging/docker/smoke-docker.sh
    class: test
    owner: ci
    public_contract: false
    deletable: true

  - path: packaging/build-core-skill-bundle.py
    class: packaging
    owner: release
    public_contract: false
    deletable: false
    notes: 构建辅助，低优先级。

  - path: docker-entrypoint.sh
    class: ci
    owner: release
    public_contract: false
    deletable: false
    notes: 容器启动边界，合理保留。
